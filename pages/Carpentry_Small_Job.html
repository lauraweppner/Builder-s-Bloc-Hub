<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BB Time Sheet">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Builders Bloc Carpentry Time Sheet — Small Job</title>
<style>
  :root{
    --bg:#eef1f5; --card:#ffffff; --ink:#1a2432; --muted:#5b6b7f;
    --line:#d3dae3; --brand:#173a5e; --brand2:#2f6db3; --accent:#2f6db3;
    --tot:#eef3f9; --tot-strong:#dbe7f5; --grand:#173a5e; --grand-ink:#ffffff;
    --ok:#1f8f5f; --warn:#8a6100; --warnbg:#fff4d6; --danger:#b23b3b; --dangerbg:#fdeaea;
    --shadow:0 1px 3px rgba(16,32,54,.12); --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom); -webkit-text-size-adjust:100%;
  }
  .appbar{position:sticky; top:0; z-index:50; background:var(--brand); color:#fff;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; box-shadow:var(--shadow);}
  .appbar .row{display:flex; align-items:center; gap:8px;}
  .appbar h1{font-size:16px; font-weight:700; margin:0; flex:1; letter-spacing:.2px;}
  .appbar .sub{font-size:12px; color:#c8d6e6; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .btn{appearance:none; border:0; border-radius:999px; padding:9px 14px; font-size:14px;
    font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.16); color:#fff; white-space:nowrap;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:#fff; color:var(--brand);}
  .btn.small{padding:7px 11px;font-size:13px;}
  .btn[disabled]{opacity:.45;}
  .tabs{position:sticky; top:var(--tabtop,58px); z-index:40; background:var(--card);
    display:flex; gap:4px; padding:8px 10px; overflow-x:auto; border-bottom:1px solid var(--line); scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{border:1px solid var(--line); background:#fff; color:var(--muted);
    padding:8px 14px; border-radius:999px; font-size:14px; font-weight:600; white-space:nowrap; cursor:pointer;}
  .tab.active{background:var(--brand2); border-color:var(--brand2); color:#fff;}
  .tab .badge{display:inline-block; margin-left:6px; background:var(--danger); color:#fff;
    border-radius:999px; font-size:11px; padding:0 6px; line-height:16px;}
  main{padding:14px; max-width:1100px; margin:0 auto;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); margin:0 0 14px; overflow:hidden;}
  .card>.card-h{padding:12px 14px; border-bottom:1px solid var(--line); font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; background:#fafbfd;}
  .card>.card-h .sp{flex:1;}
  .card>.card-b{padding:12px 14px;}
  .hint{font-size:12.5px; color:var(--muted);}
  .fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.4px;}
  .field input, .field .picker{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:16px; background:#fff; color:var(--ink); text-align:left;}
  .field input:focus{outline:none; border-color:var(--brand2); box-shadow:0 0 0 3px rgba(47,109,179,.15);}
  .picker{display:flex; align-items:center; gap:8px; cursor:pointer; min-height:46px; font-family:inherit;}
  .picker .val{flex:1; font-weight:600;}
  .picker .val.empty{font-weight:400; color:#9aa8b8;}
  .picker .chev{color:var(--brand2); font-weight:700;}
  .picker.bad{border-color:var(--danger); background:var(--dangerbg);}
  .readout{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px 14px; margin-top:10px; font-size:13px;}
  .readout div span{color:var(--muted); display:block; font-size:11px; text-transform:uppercase; letter-spacing:.4px;}
  .emp-name{display:flex; align-items:center; gap:10px; padding:10px 12px; background:#fafbfd; border-bottom:1px solid var(--line);}
  .emp-name .tag{font-size:11px; font-weight:700; color:#fff; background:var(--brand2); border-radius:6px; padding:3px 7px; white-space:nowrap;}
  .emp-name .nm{flex:1; font-weight:700; font-size:15px;}
  .emp-name .rm{background:none; border:0; color:var(--danger); font-size:13px; font-weight:600; cursor:pointer; padding:6px;}
  .scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table.grid{border-collapse:separate; border-spacing:0; width:100%; min-width:max-content;}
  table.grid th, table.grid td{border-right:1px solid var(--line); border-bottom:1px solid var(--line); text-align:center;}
  table.grid thead th{position:sticky; top:0; background:#f0f4f9; font-size:11px; font-weight:700; color:var(--ink); padding:6px 4px; z-index:2; line-height:1.15;}
  table.grid thead th .code{font-size:12px; display:block;}
  table.grid thead th .desc{font-size:9px; color:var(--muted); font-weight:600; display:block; max-width:64px; margin:1px auto 0;}
  .daycol{position:sticky; left:0; z-index:3; background:#f0f4f9; min-width:64px; font-size:12px; font-weight:700;}
  .daycol .dt{display:block; font-size:9px; font-weight:600; color:var(--muted);}
  /* Must out-specify "table.grid thead th" (z-index:2) or the other header
     cells paint over the sticky Day header when the grid is scrolled right.
     The original forms have this bug -- the Day heading disappears. */
  table.grid thead th.daycol{z-index:4;}
  table.grid tbody td{padding:0; background:#fff;}
  table.grid tbody td.daycol{padding:4px 8px;}
  table.grid input.cell{width:56px; max-width:56px; border:0; padding:10px 2px; font-size:16px; text-align:center; background:transparent; color:var(--ink); -moz-appearance:textfield;}
  table.grid input.cell::-webkit-outer-spin-button, table.grid input.cell::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  table.grid input.cell:focus{outline:none; background:#fff7dd;}
  td.rt, td.ct{background:var(--tot); font-weight:700; font-size:14px; color:var(--brand); min-width:56px;}
  td.rt.over{background:var(--warnbg); color:var(--warn);}
  td.rt.bad{background:var(--dangerbg); color:var(--danger);}
  .totcol{position:sticky; right:0; background:var(--tot); box-shadow:-1px 0 0 var(--line);}
  thead .totcol{background:#e3ecf6;}
  tr.totrow td{background:var(--tot-strong); font-weight:700; font-size:14px;}
  tr.totrow td.daycol{background:var(--tot-strong); color:var(--brand);}
  td.grand{background:var(--grand); color:var(--grand-ink); font-weight:800;}
  .pagegrand{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:var(--grand); color:#fff; border-radius:12px; margin-top:2px;}
  .pagegrand .lab{font-size:13px; font-weight:600; letter-spacing:.3px; opacity:.9;}
  .pagegrand .val{font-size:22px; font-weight:800;}
  .addbtn{display:block; width:100%; padding:14px; border:2px dashed var(--brand2); background:#f7fafd; color:var(--brand2);
    border-radius:var(--radius); font-size:15px; font-weight:700; cursor:pointer; margin-bottom:14px; font-family:inherit;}
  table.summary{border-collapse:separate; border-spacing:0; width:100%; min-width:max-content;}
  table.summary th, table.summary td{border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:9px 8px; text-align:center; font-size:13px; white-space:nowrap;}
  table.summary thead th{background:#f0f4f9; font-weight:700;}
  table.summary td.rowlab, table.summary th.rowlab{position:sticky; left:0; background:#f0f4f9; font-weight:700; text-align:left; min-width:150px; z-index:1;}
  table.summary tbody td{background:#fff; font-weight:600;}
  table.summary tr.allrow td{background:var(--tot-strong); font-weight:800; color:var(--brand);}
  table.summary tr.allrow td.rowlab{background:var(--tot-strong);}
  table.summary td.tot, table.summary th.tot{background:var(--tot); font-weight:800;}
  table.summary tr.allrow td.tot{background:var(--grand); color:#fff;}
  .legend{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:4px 14px; font-size:12.5px; color:var(--muted);}
  .legend b{color:var(--ink);}
  .msg{padding:10px 12px; border-radius:10px; font-size:13.5px; margin-bottom:8px; border:1px solid transparent; display:flex; gap:8px;}
  .msg .ic{font-weight:800;}
  .msg.err{background:var(--dangerbg); border-color:#f0c2c2; color:#7d2626;}
  .msg.warn{background:var(--warnbg); border-color:#f0dfae; color:#6b4c00;}
  .msg.ok{background:#e8f6ee; border-color:#bfe4d0; color:#145c3a;}
  .panel{display:none;}
  .panel.active{display:block;}
  .footnote{font-size:12px;color:var(--muted); text-align:center; padding:6px 0 24px;}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:#1a2432; color:#fff;
    padding:10px 16px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:300; max-width:88%; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  /* modal */
  .modal{position:fixed; inset:0; background:rgba(12,20,32,.55); z-index:200; display:none; align-items:flex-end;}
  .modal.show{display:flex;}
  .sheet{background:var(--bg); width:100%; max-height:92vh; border-radius:18px 18px 0 0; display:flex; flex-direction:column; overflow:hidden;}
  @media (min-width:700px){ .modal{align-items:center; justify-content:center;} .sheet{max-width:640px; border-radius:18px; max-height:80vh;} }
  .sheet-h{padding:14px; background:var(--brand); color:#fff; display:flex; align-items:center; gap:10px;}
  .sheet-h .t{flex:1; font-weight:700;}
  .sheet-s{padding:10px 14px; background:var(--card); border-bottom:1px solid var(--line);}
  .sheet-s input{width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:16px;}
  .sheet-s input:focus{outline:none; border-color:var(--brand2); box-shadow:0 0 0 3px rgba(47,109,179,.15);}
  .sheet-b{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);}
  .opt{padding:12px 14px; border-bottom:1px solid var(--line); background:#fff; cursor:pointer;}
  .opt:active{background:#eef3f9;}
  .opt .p{font-weight:700; font-size:15px;}
  .opt .s{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .opt.dim{opacity:.45;}
  .emptyp{padding:22px 14px; text-align:center; color:var(--muted); font-size:14px;}
  .sheetrow{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); background:#fff;}
  .sheetrow .g{flex:1; cursor:pointer; min-width:0;}
  .sheetrow .p{font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sheetrow .s{font-size:12.5px; color:var(--muted);}
  .sheetrow .del{background:none;border:0;color:var(--danger);font-weight:700;font-size:13px;cursor:pointer;padding:8px;}
  .sheetrow.cur{background:#eef3f9;}
  @media (max-width:520px){ main{padding:10px;} }
  @media print{
    :root{--bg:#fff;}
    body{background:#fff; font-size:11px;}
    .appbar,.tabs,.no-print,.addbtn,.modal,.toast{display:none !important;}
    .panel{display:block !important; break-inside:avoid;}
    .panel + .panel{break-before:page;}
    main{padding:0; max-width:none;}
    .card{box-shadow:none; break-inside:avoid; margin-bottom:10px;}
    .scroll{overflow:visible !important;}
    table.grid input.cell{width:auto; min-width:34px;}
    .print-title{display:block !important;}
  }
  .print-title{display:none; text-align:center; font-weight:800; font-size:16px; margin:0 0 8px;}
</style>
</head>

<div class="appbar">

  <div class="row">

    <button class="btn small" id="pdfBtn">Print</button>
    <div style="flex:1"></div>
    <span class="btn small" id="saveState" style="background:transparent;color:#c8d6e6;pointer-events:none;"></span>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<main id="app"></main>
<div class="toast" id="toast"></div>

  <div class="sheet-b" id="mBody"></div>
</div></div>

/* ============================ helpers ============================ */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
const num = v => { v=parseFloat((v||'').toString().replace(/,/g,'')); return isNaN(v)?0:v; };
const fmt = n => { if(!n) return ''; return (Math.round(n*100)/100).toString(); };
const fmt0 = n => { const r=Math.round(n*100)/100; return r? r.toString() : '0'; };
const DAYS = CONFIG.days, CODES = CONFIG.codes;

/* CONFIG.jobs rows: [job, subdivision, lot, address, framing, trim]
   CONFIG.employees rows: [code, name] */
const JOBS = CONFIG.jobs.map(j=>({num:j[0], sub:j[1], lot:j[2], addr:j[3], fr:j[4], tr:j[5]}));
const EMPS = CONFIG.employees.map(e=>({code:e[0], name:e[1]}));
const EMP_BY_CODE = {}; EMPS.forEach(e=>EMP_BY_CODE[e.code]=e);
const JOB_BY_NUM = {}; JOBS.forEach(j=>JOB_BY_NUM[j.num]=j);

function jobLabel(j){
  const bits=[];
  if(j.sub) bits.push(j.sub);
  if(j.lot) bits.push('Lot '+j.lot);
  if(j.addr) bits.push(j.addr);
  if(!bits.length) bits.push('(no description on file)');
  return bits.join('  ·  ');
}
function jobPhase(j){
  if(j.fr && j.tr) return 'Framing + Trim';
  if(j.fr) return 'Framing';
  if(j.tr) return 'Trim';
  return '';
}
function isoDate(d){
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function parseISO(s){
  if(!s) return null;
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3]);
}
/* Monday of the week that contains d (matches Python weekday(): Mon=0..Sun=6) */
function mondayOf(d){
  const wd=(d.getDay()+6)%7;
  const m=new Date(d.getFullYear(), d.getMonth(), d.getDate()-wd);
  return m;
}
function dayDates(weekEnding){
  const d=parseISO(weekEnding);
  if(!d) return DAYS.map(()=>null);
  const mon=mondayOf(d);
  return DAYS.map((_,i)=>new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+i));
}
function shortDate(d){ return d? (d.getMonth()+1)+'/'+d.getDate() : ''; }
function usDate(d){ const p=n=>String(n).padStart(2,'0'); return d? p(d.getMonth()+1)+'/'+p(d.getDate())+'/'+d.getFullYear() : ''; }
function nextSaturday(){
  const t=new Date();
  const add=(6-t.getDay()+7)%7;   /* Sat=6 */
  return isoDate(new Date(t.getFullYear(), t.getMonth(), t.getDate()+add));
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============================ storage ============================ */
const LS_PREFIX = 'bbts2_'+CONFIG.form+'_';
const LS_INDEX  = LS_PREFIX+'index';
const LS_CURRENT= LS_PREFIX+'current';

function loadIndex(){ try{ return JSON.parse(localStorage.getItem(LS_INDEX)||'[]'); }catch(e){ return []; } }
function saveIndex(ix){ try{ localStorage.setItem(LS_INDEX, JSON.stringify(ix)); }catch(e){} }
function loadSheet(id){ try{ return JSON.parse(localStorage.getItem(LS_PREFIX+id)||'null'); }catch(e){ return null; } }
function deleteSheet(id){
  try{ localStorage.removeItem(LS_PREFIX+id); }catch(e){}
  saveIndex(loadIndex().filter(x=>x.id!==id));
}

let S = null;    /* current sheet state */

function blankSheet(){
  return { id:uid(), form:CONFIG.form, week_ending:nextSaturday(), job:'', foreman:'',
           builder:'', crew:[], hours:{}, submitted:null, created:new Date().toISOString() };
}
function sheetTitle(s){
  const j = s.job && JOB_BY_NUM[s.job];
  const jn = j ? (j.sub ? j.sub + (j.lot?' Lot '+j.lot:'') : (j.addr || j.num)) : 'No job selected';
  return jn;
}
function persist(){
  if(!S) return;
  try{ localStorage.setItem(LS_PREFIX+S.id, JSON.stringify(S)); localStorage.setItem(LS_CURRENT, S.id); }catch(e){}
  const ix = loadIndex().filter(x=>x.id!==S.id);
  ix.unshift({ id:S.id, title:sheetTitle(S), week:S.week_ending, job:S.job,
               hours:totalHours(), submitted:S.submitted, saved:new Date().toISOString() });
  saveIndex(ix);
  const st=$('#saveState'); st.textContent='Saved';
  clearTimeout(persist._t); persist._t=setTimeout(()=>st.textContent='',1200);
  updateSubline();
}
function updateSubline(){
  const j = S.job && JOB_BY_NUM[S.job];
  const bits=[];
  bits.push(j ? j.num : 'no job');
  const d=parseISO(S.week_ending); if(d) bits.push('W/E '+usDate(d));
  bits.push(fmt0(totalHours())+' hrs');
  $('#subline').textContent = bits.join('  ·  ');
}

/* ============================ modal picker ============================ */
let _pickState=null;
function openPicker(opts){
  _pickState = opts;
  $('#mTitle').textContent = opts.title;
  $('#mSearchWrap').style.display = opts.search===false ? 'none' : '';
  $('#mSearch').value=''; $('#mSearch').placeholder = opts.placeholder||'Search...';
  renderPicker('');
  $('#modal').classList.add('show');
  if(opts.search!==false) setTimeout(()=>{ try{$('#mSearch').focus();}catch(e){} }, 60);
}
function closePicker(){ $('#modal').classList.remove('show'); _pickState=null; }
function renderPicker(q){
  const b=$('#mBody'); b.innerHTML='';
  if(!_pickState) return;
  const items=_pickState.items(q);
  if(!items.length){ b.appendChild(el('div','emptyp', _pickState.empty||'Nothing matches that search.')); return; }
  items.slice(0,300).forEach(it=>{
    if(it.custom){ b.appendChild(it.custom); return; }
    const o=el('div','opt'+(it.dim?' dim':''));
    o.appendChild(el('div','p',it.primary));
    if(it.secondary) o.appendChild(el('div','s',it.secondary));
    o.onclick=()=>{ if(it.dim) return; closePicker(); _pickState=null; it.pick(); };
    b.appendChild(o);
  });
  if(items.length>300) b.appendChild(el('div','emptyp','Showing the first 300 matches — keep typing to narrow it down.'));
}
$('#mSearch').addEventListener('input', e=>renderPicker(e.target.value));
$('#mClose').onclick=closePicker;
$('#modal').addEventListener('click', e=>{ if(e.target===$('#modal')) closePicker(); });

function pickJob(){
  openPicker({
    title:'Choose the job', placeholder:'Subdivision, lot, address or job number',
    items:(q)=>{
      const t=(q||'').trim().toUpperCase();
      const terms=t.split(/\s+/).filter(Boolean);
      let list=JOBS;
      if(terms.length){
        list=JOBS.filter(j=>{
          const hay=(j.num+' '+j.sub+' '+j.lot+' '+j.addr).toUpperCase();
          return terms.every(x=>hay.indexOf(x)>=0);
        });
      }
      return list.map(j=>({
        primary: j.num,
        secondary: jobLabel(j) + (jobPhase(j)? '   —   '+jobPhase(j) : ''),
        pick:()=>{ S.job=j.num; render(); persist(); }
      }));
    },
    empty:'No job matches that. Check JobNumber.xlsx — the job may not be set up yet.'
  });
}
function pickEmployee(title, onPick, exclude){
  const ex=new Set(exclude||[]);
  openPicker({
    title:title, placeholder:'Employee name or ID',
    items:(q)=>{
      const t=(q||'').trim().toUpperCase();
      const terms=t.split(/\s+/).filter(Boolean);
      let list=EMPS;
      if(terms.length){
        list=EMPS.filter(e=>{
          const hay=(e.name+' '+e.code).toUpperCase();
          return terms.every(x=>hay.indexOf(x)>=0);
        });
      }
      return list.map(e=>({
        primary:e.name, secondary:e.code + (ex.has(e.code)?'   —   already on this sheet':''),
        dim:ex.has(e.code), pick:()=>onPick(e)
      }));
    },
    empty:'No employee matches that. Check EmployeeID.xlsx.'
  });
}
function openSheets(){
  const ix=loadIndex();
  openPicker({
    title:'Saved time sheets', search:false,
    items:()=>{
      const out=[];
      const nb=el('div','opt');
      nb.appendChild(el('div','p','+ Start a new time sheet'));
      nb.appendChild(el('div','s','A blank sheet for another job or week'));
      nb.onclick=()=>{ closePicker(); newSheet(); };
      out.push({custom:nb});
      if(!ix.length){
        const e=el('div','emptyp','No saved sheets yet.');
        out.push({custom:e});
      }
      ix.forEach(rec=>{
        const row=el('div','sheetrow'+(S && rec.id===S.id?' cur':''));
        const g=el('div','g');
        g.appendChild(el('div','p', rec.title||'(no job)'));
        const d=parseISO(rec.week);
        g.appendChild(el('div','s', (d?('W/E '+usDate(d)):'no week') + '  ·  ' + fmt0(rec.hours||0) + ' hrs'
          + (rec.submitted? '  ·  submitted':'')));
        g.onclick=()=>{ closePicker(); openSheet(rec.id); };
        const del=el('button','del','Delete');
        del.onclick=(ev)=>{ ev.stopPropagation();
          if(!confirm('Delete this time sheet? This cannot be undone.')) return;
          deleteSheet(rec.id);
          if(S && S.id===rec.id){ newSheet(); }
          closePicker(); openSheets();
        };
        row.append(g,del);
        out.push({custom:row});
      });
      return out;
    }
  });
}
function openSheet(id){
  const s=loadSheet(id);
  if(!s){ toast('That sheet could not be opened.'); return; }
  S=normalize(s); render(); persist(); activate(0);
}
function newSheet(){
  const prev=S;
  S=blankSheet();
  if(prev && prev.crew && prev.crew.length){
    if(confirm('Start the new sheet with the same crew as "'+sheetTitle(prev)+'"?\n\nHours will be blank.')){
      S.crew=prev.crew.slice();
      S.foreman=prev.foreman;
    }
  }
  render(); persist(); activate(0);
}
function normalize(s){
  const b=blankSheet();
  s=Object.assign(b, s||{});
  s.crew=(s.crew||[]).filter(c=>EMP_BY_CODE[c]);
  s.hours=s.hours||{};
  if(s.foreman && !EMP_BY_CODE[s.foreman]) s.foreman='';
  if(s.job && !JOB_BY_NUM[s.job]) s.job='';
  return s;
}

/* ============================ totals ============================ */
const hkey=(emp,di,code)=>emp+'|'+di+'|'+code;
function cellVal(emp,di,code){ return num(S.hours[hkey(emp,di,code)]); }
function empDayTotal(emp,di){ let t=0; CODES.forEach(c=>t+=cellVal(emp,di,c[0])); return t; }
function empCodeTotal(emp,code){ let t=0; DAYS.forEach((_,di)=>t+=cellVal(emp,di,code)); return t; }
function empTotal(emp){ let t=0; DAYS.forEach((_,di)=>t+=empDayTotal(emp,di)); return t; }
function totalHours(){ let t=0; (S.crew||[]).forEach(c=>t+=empTotal(c)); return t; }
function codeTotal(code){ let t=0; (S.crew||[]).forEach(c=>t+=empCodeTotal(c,code)); return t; }

/* ============================ validation ============================ */
function validate(){
  const errors=[], warnings=[];
  if(!S.week_ending || !parseISO(S.week_ending)) errors.push('Pick a Week Ending date.');
  else {
    const d=parseISO(S.week_ending);
    if(d.getDay()!==6) warnings.push('Week Ending '+usDate(d)+' is a '+
      ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]+
      ', not a Saturday. Double-check it is right.');
    const today=new Date(); today.setHours(0,0,0,0);
    const diff=(d-today)/86400000;
    if(diff>13) warnings.push('Week Ending '+usDate(d)+' is more than two weeks out.');
    if(diff<-30) warnings.push('Week Ending '+usDate(d)+' is more than a month ago.');
  }
  if(!S.job) errors.push('Choose the job this sheet is for.');
  if(!S.foreman) errors.push('Choose the foreman.');
  if(!S.crew.length) errors.push('Add at least one employee to the crew.');
  const zero=S.crew.filter(c=>empTotal(c)===0);
  if(zero.length===S.crew.length && S.crew.length) errors.push('No hours have been entered anywhere on this sheet.');
  else zero.forEach(c=>warnings.push((EMP_BY_CODE[c]||{}).name+' has no hours — they will be left off the submission.'));
  S.crew.forEach(c=>{
    const nm=(EMP_BY_CODE[c]||{}).name||c;
    DAYS.forEach((day,di)=>{
      const t=empDayTotal(c,di);
      if(t>16) errors.push(nm+' has '+fmt0(t)+' hours on '+day+'. That is over 16 — please correct it.');
      else if(t>10) warnings.push(nm+' has '+fmt0(t)+' hours on '+day+' — anything over 10 in a day becomes overtime.');
    });
    const wt=empTotal(c);
    if(wt>40) warnings.push(nm+' has '+fmt0(wt)+' hours this week — hours over 40 become overtime.');
    if(wt>80) errors.push(nm+' has '+fmt0(wt)+' hours this week. That looks wrong — please check it.');
  });
  if(S.crew.some(c=>DAYS.some((d,di)=>di===5 && empDayTotal(c,di)>0)))
    warnings.push('This sheet has Saturday hours — they will show on the Hours to Review tab.');
  return {errors, warnings};
}

/* ============================ UI build ============================ */
const app=$('#app'), tabsEl=$('#tabs');
let panels=[], tabBtns=[], activeIdx=0;
const TAB_LABELS=['Job Info','Crew & Hours','Review & Submit'];

function render(){
  const scrollY=window.scrollY;
  app.innerHTML=''; tabsEl.innerHTML=''; panels=[]; tabBtns=[];
  TAB_LABELS.forEach((lab,i)=>{
    const t=el('button','tab',lab);
    t.onclick=()=>activate(i);
    tabsEl.appendChild(t); tabBtns.push(t);
  });
  panels.push(jobPanel(), crewPanel(), reviewPanel());
  panels.forEach(p=>app.appendChild(p));
  activate(activeIdx, true);
  updateSubline();
  window.scrollTo({top:scrollY, behavior:'instant'});
  refreshBadges();
}
function activate(idx, keepScroll){
  activeIdx=idx;
  panels.forEach((pl,i)=>pl.classList.toggle('active', i===idx));
  tabBtns.forEach((t,i)=>t.classList.toggle('active', i===idx));
  if(!keepScroll) window.scrollTo({top:0, behavior:'instant'});
  if(idx===2){ panels[2].replaceWith(reviewPanel()); panels[2]=app.children[2]; panels[2].classList.add('active'); }
  refreshBadges();
}
function refreshBadges(){
  const v=validate();
  tabBtns.forEach((t,i)=>{ const b=t.querySelector('.badge'); if(b) b.remove(); });
  if(v.errors.length && tabBtns[2]){
    const b=el('span','badge', String(v.errors.length)); tabBtns[2].appendChild(b);
  }
}

function jobPanel(){
  const panel=el('div','panel');
  const c=el('div','card');
  c.appendChild(el('div','card-h','Job Information'));
  const b=el('div','card-b');
  const f=el('div','fields');

  /* week ending */
  const w1=el('div','field');
  w1.appendChild(el('label',null,'Week Ending'));
  const wi=el('input'); wi.type='date'; wi.value=S.week_ending||'';
  wi.oninput=()=>{ S.week_ending=wi.value; persist(); render(); };
  w1.appendChild(wi); f.appendChild(w1);

  /* job picker */
  const w2=el('div','field');
  w2.appendChild(el('label',null,'Job'));
  const jb=el('button','picker'+(S.job?'':' bad'));
  const j=S.job&&JOB_BY_NUM[S.job];
  const jv=el('span','val'+(j?'':' empty'), j? j.num : 'Tap to choose a job');
  jb.append(jv, el('span','chev','›'));
  jb.onclick=pickJob;
  w2.appendChild(jb); f.appendChild(w2);

  /* foreman */
  const w3=el('div','field');
  w3.appendChild(el('label',null,'Foreman'));
  const fb=el('button','picker'+(S.foreman?'':' bad'));
  const fe=S.foreman&&EMP_BY_CODE[S.foreman];
  const fv=el('span','val'+(fe?'':' empty'), fe? fe.name : 'Tap to choose the foreman');
  fb.append(fv, el('span','chev','›'));
  fb.onclick=()=>pickEmployee('Choose the foreman', e=>{
    S.foreman=e.code;
    if(!S.crew.includes(e.code)) S.crew.unshift(e.code);
    render(); persist();
  });
  w3.appendChild(fb); f.appendChild(w3);

  if(CONFIG.show_builder){
    const w4=el('div','field');
    w4.appendChild(el('label',null,'Name of Builder'));
    const bi=el('input'); bi.type='text'; bi.value=S.builder||''; bi.autocomplete='off';
    bi.oninput=()=>{ S.builder=bi.value; persist(); };
    w4.appendChild(bi); f.appendChild(w4);
  }
  b.appendChild(f);

  if(j){
    const ro=el('div','readout');
    const add=(lab,val)=>{ const d=el('div'); d.appendChild(el('span',null,lab)); d.appendChild(document.createTextNode(val||'—')); ro.appendChild(d); };
    add('Job Number', j.num);
    add('Subdivision', j.sub);
    add('Lot #', j.lot);
    add('Address', j.addr);
    add('Scope on file', jobPhase(j));
    b.appendChild(ro);
    const note=el('div','hint'); note.style.marginTop='10px';
    note.textContent='These come straight from JobNumber.xlsx, so accounting gets the exact job number — nothing to look up later.';
    b.appendChild(note);
  } else {
    const note=el('div','hint'); note.style.marginTop='10px';
    note.textContent='Search by subdivision, lot, address or job number. '+JOBS.length+' jobs available (list built '+CONFIG.built+').';
    b.appendChild(note);
  }
  c.appendChild(b); panel.appendChild(c);

  const lc=el('div','card');
  lc.appendChild(el('div','card-h','Column Key'));
  const lb=el('div','card-b'); const g=el('div','legend');
  CODES.forEach(cd=>{ const s=el('div'); s.appendChild(el('b',null,cd[0])); s.appendChild(document.createTextNode(' — '+cd[1])); g.appendChild(s); });
  lb.appendChild(g); lc.appendChild(lb); panel.appendChild(lc);
  return panel;
}

function empGrid(empCode){
  const e=EMP_BY_CODE[empCode]||{code:empCode,name:empCode};
  const card=el('div','card');
  const nw=el('div','emp-name');
  nw.appendChild(el('span','tag', empCode===S.foreman?'FOREMAN':'CREW'));
  nw.appendChild(el('span','nm', e.name));
  const rm=el('button','rm','Remove');
  rm.onclick=()=>{
    if(empTotal(empCode)>0 && !confirm('Remove '+e.name+' and their hours from this sheet?')) return;
    S.crew=S.crew.filter(c=>c!==empCode);
    DAYS.forEach((_,di)=>CODES.forEach(c=>{ delete S.hours[hkey(empCode,di,c[0])]; }));
    if(S.foreman===empCode) S.foreman='';
    render(); persist();
  };
  nw.appendChild(rm);
  card.appendChild(nw);

  const dates=dayDates(S.week_ending);
  const scroll=el('div','scroll');
  const tbl=el('table','grid');
  const thead=el('thead'), hr=el('tr');
  hr.appendChild(el('th','daycol','Day'));
  CODES.forEach(cd=>{
    const th=el('th');
    th.appendChild(el('span','code',cd[0]));
    th.appendChild(el('span','desc',cd[1]));
    th.title=cd[0]+' — '+cd[1];
    hr.appendChild(th);
  });
  const tt=el('th','totcol'); tt.appendChild(el('span','code','Total')); tt.appendChild(el('span','desc','Daily')); hr.appendChild(tt);
  thead.appendChild(hr); tbl.appendChild(thead);

  const tb=el('tbody');
  DAYS.forEach((day,di)=>{
    const tr=el('tr');
    const dc=el('td','daycol'); dc.appendChild(document.createTextNode(day));
    if(dates[di]) dc.appendChild(el('span','dt', shortDate(dates[di])));
    tr.appendChild(dc);
    CODES.forEach(cd=>{
      const td=el('td');
      const inp=el('input','cell');
      inp.type='number'; inp.inputMode='decimal'; inp.step='any'; inp.min='0';
      inp.value = S.hours[hkey(empCode,di,cd[0])] || '';
      inp.oninput=()=>{
        const k=hkey(empCode,di,cd[0]);
        if(inp.value==='') delete S.hours[k]; else S.hours[k]=inp.value;
        recalcCard(card, empCode); persist(); refreshBadges();
      };
      td.appendChild(inp); tr.appendChild(td);
    });
    const rt=el('td','rt totcol'); rt.dataset.rt=di; tr.appendChild(rt);
    tb.appendChild(tr);
  });
  const trt=el('tr','totrow');
  trt.appendChild(el('td','daycol','TOTAL'));
  CODES.forEach(cd=>{ const td=el('td','ct'); td.dataset.ct=cd[0]; trt.appendChild(td); });
  const g=el('td','grand totcol'); g.dataset.eg='1'; trt.appendChild(g);
  tb.appendChild(trt);
  tbl.appendChild(tb); scroll.appendChild(tbl); card.appendChild(scroll);
  recalcCard(card, empCode);
  return card;
}
function recalcCard(card, empCode){
  DAYS.forEach((_,di)=>{
    const c=card.querySelector('[data-rt="'+di+'"]');
    if(!c) return;
    const t=empDayTotal(empCode,di);
    c.textContent=fmt(t);
    c.className='rt totcol'+(t>16?' bad':(t>10?' over':''));
  });
  CODES.forEach(cd=>{
    const c=card.querySelector('[data-ct="'+cd[0]+'"]');
    if(c) c.textContent=fmt(empCodeTotal(empCode,cd[0]));
  });
  const g=card.querySelector('[data-eg]');
  if(g) g.textContent=fmt(empTotal(empCode));
  const banner=document.getElementById('crewGrand');
  if(banner) banner.textContent=fmt0(totalHours());
  updateSubline();
}

function crewPanel(){
  const panel=el('div','panel');
  const head=el('div'); head.style.margin='2px 2px 12px';
  const t=el('div'); t.style.fontWeight='800'; t.style.fontSize='18px'; t.textContent='Crew & Hours';
  const s=el('div','hint');
  s.textContent = S.job ? ('Job '+S.job+'  ·  '+sheetTitle(S)) : 'Choose a job on the Job Info tab first.';
  head.append(t,s); panel.appendChild(head);

  if(!S.crew.length){
    const c=el('div','card'); const b=el('div','card-b');
    b.appendChild(el('div','hint','No one on this sheet yet. Add the crew that worked this job this week — add as many people as you need.'));
    c.appendChild(b); panel.appendChild(c);
  }
  S.crew.forEach(code=>panel.appendChild(empGrid(code)));

  const add=el('button','addbtn','+  Add Employee');
  add.onclick=()=>pickEmployee('Add an employee', e=>{
    if(!S.crew.includes(e.code)) S.crew.push(e.code);
    render(); persist(); activate(1);
  }, S.crew);
  panel.appendChild(add);

  const banner=el('div','pagegrand');
  banner.appendChild(el('span','lab','SHEET TOTAL (all employees)'));
  const val=el('span','val'); val.id='crewGrand'; val.textContent=fmt0(totalHours());
  banner.appendChild(val);
  panel.appendChild(banner);
  return panel;
}

function reviewPanel(){
  const panel=el('div','panel');
  const head=el('div'); head.style.margin='2px 2px 12px';
  const t=el('div'); t.style.fontWeight='800'; t.style.fontSize='18px'; t.textContent='Review & Submit';
  const s=el('div','hint'); s.textContent='Check the totals, then send it in.';
  head.append(t,s); panel.appendChild(head);

  const v=validate();
  const mc=el('div','card'); const mb=el('div','card-b');
  if(!v.errors.length && !v.warnings.length){
    const m=el('div','msg ok'); m.appendChild(el('span','ic','✓'));
    m.appendChild(el('div',null,'Everything checks out. Tap Submit to send this sheet to accounting.'));
    mb.appendChild(m);
  }
  v.errors.forEach(x=>{ const m=el('div','msg err'); m.appendChild(el('span','ic','!')); m.appendChild(el('div',null,x)); mb.appendChild(m); });
  v.warnings.forEach(x=>{ const m=el('div','msg warn'); m.appendChild(el('span','ic','⚠')); m.appendChild(el('div',null,x)); mb.appendChild(m); });
  mc.appendChild(mb); panel.appendChild(mc);

  /* by employee */
  const c1=el('div','card'); c1.appendChild(el('div','card-h','Totals by Employee'));
  const sc1=el('div','scroll'); const t1=el('table','summary');
  const th1=el('thead'); const hr1=el('tr');
  hr1.appendChild(el('th','rowlab','Employee'));
  const dates=dayDates(S.week_ending);
  DAYS.forEach((d,i)=>{ const th=el('th'); th.appendChild(document.createTextNode(d)); if(dates[i]){ th.appendChild(el('div','hint',shortDate(dates[i]))); } hr1.appendChild(th); });
  hr1.appendChild(el('th','tot','TOTAL'));
  th1.appendChild(hr1); t1.appendChild(th1);
  const tb1=el('tbody');
  S.crew.forEach(code=>{
    const tr=el('tr');
    tr.appendChild(el('td','rowlab',(EMP_BY_CODE[code]||{}).name||code));
    DAYS.forEach((d,di)=>tr.appendChild(el('td',null,fmt0(empDayTotal(code,di)))));
    tr.appendChild(el('td','tot',fmt0(empTotal(code))));
    tb1.appendChild(tr);
  });
  const trA=el('tr','allrow');
  trA.appendChild(el('td','rowlab','ALL'));
  DAYS.forEach((d,di)=>{ let t=0; S.crew.forEach(c=>t+=empDayTotal(c,di)); trA.appendChild(el('td',null,fmt0(t))); });
  trA.appendChild(el('td','tot',fmt0(totalHours())));
  tb1.appendChild(trA);
  t1.appendChild(tb1); sc1.appendChild(t1); c1.appendChild(sc1); panel.appendChild(c1);

  /* by cost code */
  const c2=el('div','card'); c2.appendChild(el('div','card-h','Totals by Cost Code'));
  const sc2=el('div','scroll'); const t2=el('table','summary');
  const th2=el('thead'); const hr2=el('tr');
  hr2.appendChild(el('th','rowlab','Cost Code'));
  hr2.appendChild(el('th','tot','HOURS'));
  th2.appendChild(hr2); t2.appendChild(th2);
  const tb2=el('tbody');
  CODES.forEach(cd=>{
    const v2=codeTotal(cd[0]);
    if(!v2) return;
    const tr=el('tr');
    tr.appendChild(el('td','rowlab',cd[0]+' — '+cd[1]));
    tr.appendChild(el('td','tot',fmt0(v2)));
    tb2.appendChild(tr);
  });
  const trB=el('tr','allrow');
  trB.appendChild(el('td','rowlab','ALL CODES'));
  trB.appendChild(el('td','tot',fmt0(totalHours())));
  tb2.appendChild(trB);
  t2.appendChild(tb2); sc2.appendChild(t2); c2.appendChild(sc2); panel.appendChild(c2);

  const fn=el('div','footnote');
  fn.textContent='Saved on this device automatically. Submitting emails a data file to accounting.';
  panel.appendChild(fn);
  return panel;
}

/* ============================ export / submit ============================ */
function buildPayload(){
  const j=JOB_BY_NUM[S.job]||{};
  const dates=dayDates(S.week_ending);
  const entries=[];
  S.crew.forEach(code=>{
    DAYS.forEach((day,di)=>{
      CODES.forEach(cd=>{
        const h=cellVal(code,di,cd[0]);
        if(!h) return;
        entries.push({ emp_code:code, emp_name:(EMP_BY_CODE[code]||{}).name||'',
                       date: dates[di]? isoDate(dates[di]) : '', day:day,
                       cost_code:cd[0], desc:cd[1], hours:Math.round(h*100)/100 });
      });
    });
  });
  return {
    format:'builders-bloc-timesheet', version:2, form:CONFIG.form,
    form_title:CONFIG.title, reference_built:CONFIG.built,
    sheet_id:S.id,
    week_ending:S.week_ending,
    job:{ number:j.num||'', subdivision:j.sub||'', lot:j.lot||'', address:j.addr||'',
          framing:j.fr||0, trim:j.tr||0 },
    builder:S.builder||'',
    foreman:{ code:S.foreman||'', name:(EMP_BY_CODE[S.foreman]||{}).name||'' },
    crew:S.crew.map(c=>({code:c, name:(EMP_BY_CODE[c]||{}).name||''})),
    entries:entries,
    total_hours:Math.round(totalHours()*100)/100,
    submitted_at:new Date().toISOString()
  };
}
function fileBase(){
  const j=JOB_BY_NUM[S.job];
  const jn=j? j.num : 'NOJOB';
  const we=S.week_ending? S.week_ending.replace(/-/g,'') : 'NOWEEK';
  return ('Timesheet_'+jn+'_WE'+we).replace(/[^A-Za-z0-9_\-]/g,'_');
}
async function submitSheet(){
  const v=validate();
  if(v.errors.length){ activate(2); toast('Fix the '+v.errors.length+' item(s) in red first.'); return; }
  if(v.warnings.length){
    if(!confirm('There '+(v.warnings.length===1?'is 1 warning':'are '+v.warnings.length+' warnings')+' on this sheet.\n\nSubmit anyway?')) { activate(2); return; }
  }
  const payload=buildPayload();
  const text=JSON.stringify(payload,null,1);
  const name=fileBase()+'.'+CONFIG.ext;
  const type='application/json';
  let sent=false;
  try{
    if(navigator.canShare){
      const file=new File([text], name, {type:type});
      if(navigator.canShare({files:[file]})){
        await navigator.share({title:'Time Sheet '+(payload.job.number||''), files:[file]});
        sent=true;
      }
    }
  }catch(err){ if(err && err.name==='AbortError') return; }
  if(!sent){
    try{
      const blob=new Blob([text],{type:type});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      sent=true;
      toast('Saved '+name+' — attach it to your email to accounting.');
    }catch(e){}
  }
  if(sent){
    S.submitted=new Date().toISOString();
    persist();
    if(!navigator.canShare) return;
    toast('Submitted — '+fmt0(payload.total_hours)+' hours sent.');
  } else {
    toast('Could not create the file on this device.');
  }
}

/* ============================ wiring ============================ */
$('#submitBtn').onclick=submitSheet;
$('#sheetsBtn').onclick=openSheets;
$('#newBtn').onclick=newSheet;
$('#pdfBtn').onclick=()=>{
  const j=JOB_BY_NUM[S.job];
  const d=parseISO(S.week_ending);
  $('#printTitle').textContent=CONFIG.title+(j?('  —  '+j.num):'')+(d?('  —  W/E '+usDate(d)):'');
  window.print();
};
function fixTabTop(){ const ab=document.querySelector('.appbar'); if(ab) document.documentElement.style.setProperty('--tabtop', ab.offsetHeight+'px'); }
window.addEventListener('resize',fixTabTop); window.addEventListener('load',fixTabTop);

/* boot */
(function boot(){
  let id=null;
  try{ id=localStorage.getItem(LS_CURRENT); }catch(e){}
  const s=id? loadSheet(id):null;
  S = s? normalize(s) : blankSheet();
  render(); fixTabTop();
})();
</script>
