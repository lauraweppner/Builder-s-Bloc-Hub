<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field Calendar — Builder's Bloc</title>
<style>
:root{
  --ink:#16181d; --ink2:#4a5160; --ink3:#7b8494;
  --line:#c9ced8; --line2:#e4e8ef;
  --paper:#ffffff; --bg:#eef1f6; --band:#d9dde5;
  --accent:#7a3b12;
  --accent-bg:#fdf5ee;
  --ok:#1d7a4c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:#1f2530; color:#e9edf4;
  border-bottom:1px solid #0d1117;
}
.topbar-in{max-width:1120px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em;font-size:14px;white-space:nowrap}
.brand span{color:#9aa6b8;font-weight:500}
.spacer{flex:1}
.tbtn{
  background:#2c3543;border:1px solid #3c4757;color:#dbe2ec;
  padding:6px 11px;border-radius:7px;cursor:pointer;font-size:13px;line-height:1;
}
.tbtn:hover{background:#38424f}
.tbtn.on{background:#7a3b12;border-color:#94491a;color:#fff}
.saveflag{font-size:12px;color:#8fd3ac;min-width:64px;text-align:right}

/* ---------- date nav ---------- */
.datebar{
  background:#fff;border-bottom:1px solid var(--line);
  position:sticky;top:41px;z-index:35;
}
.datebar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
  background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center
}
.nav:hover{background:#f4f6fa}
.today-date{font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.today-date .dow{color:var(--accent)}
.pill{
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;
  background:var(--accent-bg);color:var(--accent);border:1px solid #e8d5c2;
  padding:3px 8px;border-radius:99px
}
.pill.gray{background:#f1f3f7;color:var(--ink3);border-color:var(--line2)}
input[type=date]{
  border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;background:#fff
}
.mini{font-size:12px;color:var(--ink3)}

/* ---------- page ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:16px}
.sheet{
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 1px 2px rgba(16,20,30,.05),0 8px 24px rgba(16,20,30,.05);
  overflow:hidden
}
.quote{
  background:var(--band);padding:10px 14px;font-size:14px;line-height:1.4;
  border-bottom:1px solid var(--line);font-style:italic
}
.topic{
  padding:8px 14px;border-bottom:1px solid var(--line);font-size:14px;background:#fafbfd
}
.topic b{font-style:normal;color:var(--accent);font-weight:700}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:stretch}
.col{min-width:0}
.col.left{border-right:1px solid var(--line)}
.col.right{display:flex;flex-direction:column}
.col.right .sec{flex:1;display:flex;flex-direction:column;border-bottom:0}
.col.right textarea.f{flex:1;resize:none}

.sec{border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec-h{
  display:flex;align-items:center;gap:8px;
  padding:7px 12px;background:#f4f6fa;border-bottom:1px solid var(--line2);
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)
}
.sec-h .sub{margin-left:auto;font-size:11px;font-weight:600;color:var(--ink3);text-transform:none;letter-spacing:0}
.rowgrid{display:flex;flex-direction:column}
.r{display:grid;border-bottom:1px solid var(--line2)}
.r.two{grid-template-columns:1fr 88px}
.r.jobs{grid-template-columns:26px 1fr 74px}
.cell{position:relative;border-right:1px solid var(--line2)}
.cell:last-child{border-right:0}
input.f,textarea.f{
  width:100%;border:0;outline:0;background:transparent;font:inherit;
  padding:7px 10px;color:var(--ink);display:block
}
input.f{height:34px}
input.f:focus,textarea.f:focus{background:#fffbf2;box-shadow:inset 0 0 0 2px #eccfae}
textarea.f{resize:vertical;min-height:var(--mh,84px);line-height:1.5}
.ck{display:flex;align-items:center;justify-content:center;height:34px}
.ck input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.done input.f{text-decoration:line-through;color:var(--ink3)}
.addrow{
  padding:5px 10px;font-size:12px;color:var(--accent);cursor:pointer;background:#fff;
  border:0;text-align:left;width:100%
}
.addrow:hover{background:var(--accent-bg)}
.notes-lines{padding:0}
.foot{
  padding:10px 14px;text-align:center;font-size:13px;color:var(--ink2);
  border-top:1px solid var(--line);background:#fafbfd
}
.hrs-total{font-variant-numeric:tabular-nums}

/* week strip */
.week{display:flex;gap:5px;margin:0 0 14px;flex-wrap:wrap}
.wd{
  flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:6px 2px;text-align:center;cursor:pointer;line-height:1.2
}
.wd:hover{background:#f4f6fa}
.wd.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.wd .d1{font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.wd .d2{font-size:17px;font-weight:700}
.wd .dot{width:5px;height:5px;border-radius:99px;background:var(--accent);margin:2px auto 0;opacity:0}
.wd.has .dot{opacity:1}
.wd.sel .dot{background:#fff}

/* reference view */
.ref{display:none}
.ref.show{display:block}
.day.hide{display:none}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.card h2{margin:0;padding:10px 14px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;background:#f4f6fa;border-bottom:1px solid var(--line)}
.card .body{padding:12px 14px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line2);padding:5px 8px;text-align:left;vertical-align:top}
th{background:#f7f9fc;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);position:sticky;top:0}
.scroll{max-height:460px;overflow:auto}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-bottom:10px}
.fgrid{columns:4;column-gap:18px;font-size:13px;font-variant-numeric:tabular-nums}
.fgrid div{break-inside:avoid;display:flex;justify-content:space-between;border-bottom:1px dotted var(--line2);padding:2px 0}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.calcbox{border:1px solid var(--line2);border-radius:8px;padding:12px}
.calcbox h3{margin:0 0 8px;font-size:13px}
.calcbox label{display:block;font-size:12px;color:var(--ink2);margin:6px 0 2px}
.calcbox input,.calcbox select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit}
.result{margin-top:10px;padding:8px 10px;background:var(--accent-bg);border:1px solid #e8d5c2;border-radius:8px;font-weight:700;color:var(--accent)}
.hint{font-size:12px;color:var(--ink3);margin-top:6px}

/* ---------- in-page dialogs (iOS blocks native confirm/alert) ---------- */
.overlay{
  position:fixed;inset:0;z-index:100;background:rgba(16,20,30,.45);
  display:flex;align-items:center;justify-content:center;padding:20px;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)
}
.modal{
  background:#fff;border-radius:14px;max-width:400px;width:100%;
  box-shadow:0 20px 50px rgba(10,14,22,.3);padding:20px;text-align:left
}
.modal h3{margin:0 0 6px;font-size:17px}
.modal p{margin:0 0 16px;font-size:14px;color:var(--ink2);line-height:1.45}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mbtn{
  border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:10px 16px;border-radius:9px;font-size:15px;cursor:pointer;min-height:44px
}
.mbtn:hover{background:#f4f6fa}
.mbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.mbtn.danger{background:#a32c1c;border-color:#a32c1c;color:#fff}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:110;
  background:#1f2530;color:#e9edf4;padding:11px 18px;border-radius:10px;font-size:14px;
  box-shadow:0 8px 24px rgba(10,14,22,.3);max-width:90vw;text-align:center
}

@media (max-width:860px){
  .cols{grid-template-columns:1fr}
  .col.left{border-right:0;border-bottom:1px solid var(--line)}
  .fgrid{columns:2}
  .calc{grid-template-columns:1fr}
}

/* ---------- print: current day only ---------- */
@media print{
  body{background:#fff;font-size:10.5px}
  .topbar,.datebar,.week,.ref,.noprint{display:none !important}
  .wrap{padding:0;max-width:none}
  .sheet{border:1.2px solid #000;border-radius:0;box-shadow:none}
  .quote{background:#d9d9d9 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;
    padding:5px 8px;font-size:10.5px}
  .topic{padding:4px 8px;font-size:10.5px;background:#fff !important}
  .sec-h{padding:3px 8px;font-size:9px;background:#fff !important;border-bottom:1px solid #000}
  .foot{padding:5px 8px;font-size:10px;background:#fff !important}
  .cell,.r,.sec,.col.left,.quote,.topic,.foot{border-color:#000 !important}
  .cols{grid-template-columns:1fr 1fr !important}
  .col.left{border-right:1px solid #000 !important;border-bottom:0 !important}
  input.f,textarea.f{padding:2px 5px;font-size:10.5px}
  input.f{height:19px}
  textarea.f{min-height:calc(var(--mh,84px) * .5);line-height:1.35}
  .col.right textarea.f{min-height:0}
  .ck{height:19px}
  .ck input{width:11px;height:11px}
  .addrow{display:none}
  input.f:focus,textarea.f:focus{background:transparent !important;box-shadow:none !important}
  @page{margin:11mm}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">Field Calendar <span>· Builder's Bloc</span></div>
    <div class="spacer"></div>
    <button class="tbtn on" id="tabDay">Day</button>
    <button class="tbtn" id="tabRef">Reference</button>
    <input type="text" id="ownerIn" placeholder="Whose calendar?" autocomplete="off"
           style="min-height:34px;padding:5px 10px;border:1px solid #c9d3e0;border-radius:8px;
                  font:inherit;font-size:13px;width:150px;margin-right:6px">
    <button class="tbtn" id="btnExport">Export PDF</button>
    <button class="tbtn" id="btnBackup">Backup</button>
    <button class="tbtn" id="btnImport">Import</button>
    <input type="file" id="fileIn" accept=".json,application/json,text/plain" style="display:none">
    <div class="saveflag" id="saveflag"></div>
  </div>
</div>

<div class="datebar">
  <div class="datebar-in">
    <button class="nav" id="prev" title="Previous day">&#9664;</button>
    <button class="nav" id="next" title="Next day">&#9654;</button>
    <div class="today-date"><span class="dow" id="hdDow"></span><span id="hdRest"></span></div>
    <span class="pill" id="pillToday" style="display:none">Today</span>
    <span class="pill gray" id="pillFilled" style="display:none">Saved</span>
    <div class="spacer"></div>
    <input type="date" id="datePick">
    <button class="tbtn" id="btnToday" style="background:#f1f3f7;color:#333;border-color:#c9ced8">Today</button>
  </div>
</div>

<div class="wrap">
  <div class="day" id="dayView">
    <div class="week" id="weekStrip"></div>
    <div class="sheet" id="sheet"></div>
    <div class="mini noprint" style="margin-top:10px;display:flex;gap:14px;flex-wrap:wrap">
      <span id="statusLine"></span>
      <span class="spacer"></span>
      <button class="tbtn" id="btnCarry" style="background:#f1f3f7;color:#333;border-color:#c9ced8">Carry unfinished tasks &rarr; next day</button>
      <button class="tbtn" id="btnClear" style="background:#f1f3f7;color:#333;border-color:#c9ced8">Clear this day</button>
    </div>
  </div>

  <div class="ref" id="refView">
    <div class="card">
      <h2>Concrete &amp; rock calculator</h2>
      <div class="body">
        <div class="calc">
          <div class="calcbox">
            <h3>Flatwork / slab</h3>
            <label>Length (ft)</label><input type="number" id="cL" value="20">
            <label>Width (ft)</label><input type="number" id="cW" value="20">
            <label>Thickness</label>
            <select id="cT">
              <option value="80">4" slab — 80 sf per yard</option>
              <option value="54">6" slab — 54 sf per yard</option>
            </select>
            <label>Rock thickness</label>
            <select id="cR">
              <option value="52">4" rock — 52 sf per ton</option>
              <option value="0">none</option>
            </select>
            <div class="result" id="cOut"></div>
            <div class="hint">Length &times; Width &divide; sf-per-yard. Rock: Length &times; Width &divide; 52.</div>
          </div>
          <div class="calcbox">
            <h3>Piers / round footings</h3>
            <label>Diameter (in)</label><input type="number" id="pD" value="12">
            <label>Depth (ft)</label><input type="number" id="pH" value="4">
            <label>Quantity</label><input type="number" id="pQ" value="1">
            <div class="result" id="pOut"></div>
            <div class="hint">&frac12;dia &times; &frac12;dia &times; 3.14 &times; depth &divide; 27 (feet).</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Decimal equivalents</h2>
      <div class="body">
        <input class="search" id="fSearch" placeholder="Search a fraction or decimal (e.g. 3/8 or 0.375)">
        <div class="fgrid" id="fGrid"></div>
      </div>
    </div>

    <div class="card">
      <h2>Vendor list</h2>
      <div class="body">
        <input class="search" id="vSearch" placeholder="Search vendors by name, city, phone…">
        <div class="scroll"><table id="vTable"></table></div>
      </div>
    </div>

    <div class="card">
      <h2>Customer list</h2>
      <div class="body">
        <input class="search" id="uSearch" placeholder="Search customers…">
        <div class="scroll"><table id="uTable"></table></div>
      </div>
    </div>

    <div class="card">
      <h2>Address book</h2>
      <div class="body">
        <input class="search" id="abName" placeholder="Add a contact — name">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:10px">
          <input class="search" id="abWork" placeholder="Work phone" style="margin:0">
          <input class="search" id="abCell" placeholder="Cell" style="margin:0">
          <input class="search" id="abNote" placeholder="Notes" style="margin:0">
          <button class="tbtn" id="abAdd" style="background:#7a3b12;color:#fff;border-color:#7a3b12">Add</button>
        </div>
        <table id="abTable"></table>
      </div>
    </div>
  </div>
</div>

/* ---------- storage (localStorage with in-memory fallback) ---------- */
const KEY='bb-day-planner-v1';
let memStore=null, canPersist=true;
function loadStore(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ canPersist=false; }
  return {v:1,days:{},contacts:[]};
}
function saveStore(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ canPersist=false; memStore=store; }
}
let store=loadStore();
if(!store.days) store.days={};
if(!store.contacts) store.contacts=[];

let saveTimer=null;
function flagSaved(){
  const el=document.getElementById('saveflag');
  el.textContent = canPersist ? 'Saved' : 'In memory';
  el.style.color = canPersist ? '#8fd3ac' : '#f0c674';
  clearTimeout(flagSaved._t);
  flagSaved._t=setTimeout(()=>{el.textContent='';},1400);
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ saveStore(); flagSaved(); paintWeek(); updateStatus(); },350);
}

/* ---------- date helpers ---------- */
const DOWN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function parseISO(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function mmdd(d){return pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function contentFor(d){
  let k=mmdd(d);
  if(!DAYS[k]) k='02-28';           // non-leap safety
  const a=DAYS[k]||['','',''];
  return {quote:a[0],topic:a[1],foot:a[2],tb:!!a[3]};
}
let cur=new Date(); cur.setHours(0,0,0,0);
const TODAY=iso(cur);

/* ---------- day record ---------- */
function blank(){return {weather:'',appts:[],jobs:[],personal:[],goals:[],verbal:'',goalsText:'',notesEmp:'',jobNotes:''};}
function rec(k,make){
  if(!store.days[k]){ if(!make) return blank(); store.days[k]=blank(); }
  const r=store.days[k];
  for(const f of ['appts','jobs','personal','goals']) if(!Array.isArray(r[f])) r[f]=[];
  return r;
}
function hasData(k){
  const r=store.days[k]; if(!r) return false;
  if((r.weather||'').trim()||(r.verbal||'').trim()||(r.goalsText||'').trim()||(r.notesEmp||'').trim()||(r.jobNotes||'').trim()) return true;
  for(const f of ['appts','jobs','personal']) if((r[f]||[]).some(x=>x&&((x[0]||'').trim()||(x[1]||'').trim()))) return true;
  if((r.goals||[]).some(x=>(x||'').trim())) return true;
  return false;
}

/* ---------- layout spec ---------- */
function layoutFor(d){
  const w=d.getDay();
  if(w===6) return 'sat';
  if(w===0) return 'sun';
  return 'week';
}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function pairRows(field,rows,r,ph1,ph2){
  let h='<div class="rowgrid">';
  const n=Math.max(rows,(r[field]||[]).length);
  for(let i=0;i<n;i++){
    const v=(r[field]&&r[field][i])||[];
    h+=`<div class="r two">
      <div class="cell"><input class="f" data-f="${field}" data-i="${i}" data-j="0" placeholder="${i===0?esc(ph1):''}" value="${esc(v[0])}"></div>
      <div class="cell"><input class="f" data-f="${field}" data-i="${i}" data-j="1" placeholder="${i===0?esc(ph2):''}" value="${esc(v[1])}"></div>
    </div>`;
  }
  h+=`</div><button class="addrow noprint" data-add="${field}">+ add row</button>`;
  return h;
}
function jobRows(rows,r){
  let h='<div class="rowgrid">';
  const n=Math.max(rows,(r.jobs||[]).length);
  for(let i=0;i<n;i++){
    const v=(r.jobs&&r.jobs[i])||[];
    const done=v[2]?' done':'';
    h+=`<div class="r jobs${done}">
      <div class="cell ck"><input type="checkbox" data-f="jobs" data-i="${i}" data-j="2"${v[2]?' checked':''}></div>
      <div class="cell"><input class="f" data-f="jobs" data-i="${i}" data-j="0" placeholder="${i===0?'Job / task':''}" value="${esc(v[0])}"></div>
      <div class="cell"><input class="f" data-f="jobs" data-i="${i}" data-j="1" placeholder="${i===0?'hrs':''}" value="${esc(v[1])}"></div>
    </div>`;
  }
  h+=`</div><button class="addrow noprint" data-add="jobs">+ add task</button>`;
  return h;
}
function lineRows(field,rows,r,ph){
  let h='<div class="rowgrid">';
  const n=Math.max(rows,(r[field]||[]).length);
  for(let i=0;i<n;i++){
    h+=`<div class="r"><div class="cell"><input class="f" data-f="${field}" data-i="${i}" placeholder="${i===0?esc(ph):''}" value="${esc((r[field]&&r[field][i])||'')}"></div></div>`;
  }
  h+=`</div><button class="addrow noprint" data-add="${field}">+ add row</button>`;
  return h;
}
function ta(field,r,ph,min){
  return `<textarea class="f" data-f="${field}" placeholder="${esc(ph||'')}" style="--mh:${min||84}px">${esc(r[field])}</textarea>`;
}
function sec(title,inner,sub){
  return `<div class="sec"><div class="sec-h">${esc(title)}${sub?`<span class="sub">${sub}</span>`:''}</div>${inner}</div>`;
}

/* ---------- render ---------- */
function render(){
  const k=iso(cur), r=rec(k,false), c=contentFor(cur), lay=layoutFor(cur);
  document.getElementById('hdDow').textContent=DOWN[cur.getDay()]+', ';
  document.getElementById('hdRest').textContent=MONN[cur.getMonth()]+' '+cur.getDate()+', '+cur.getFullYear();
  document.getElementById('datePick').value=k;
  document.getElementById('pillToday').style.display = k===TODAY?'':'none';
  document.getElementById('pillFilled').style.display = hasData(k)?'':'none';

  let left='',right='';
  if(lay==='week'){
    left = sec('Weather','<div class="rowgrid"><div class="r"><div class="cell"><input class="f" data-f="weather" placeholder="Forecast / conditions" value="'+esc(r.weather)+'"></div></div></div>')
         + sec('Appointments / Training Today', pairRows('appts',5,r,'Where / who?','Time'))
         + sec('Jobs / Tasks to do today', jobRows(7,r), '<span class="hrs-total" id="hrsTotal"></span>')
         + sec('Personal Appts', pairRows('personal',3,r,'What','Time'))
         + sec('Goals to work on', lineRows('goals',2,r,'Goal'))
         + sec('Verbal agreements made', ta('verbal',r,'Who, what, when…',96))
         + sec('Notes about employees', ta('notesEmp',r,'',96));
    right = sec('Job Notes', ta('jobNotes',r,'',200));
  } else if(lay==='sat'){
    left = sec('Weather','<div class="rowgrid"><div class="r"><div class="cell"><input class="f" data-f="weather" placeholder="Forecast / conditions" value="'+esc(r.weather)+'"></div></div></div>')
         + sec('Appointments Today', pairRows('appts',3,r,'Where / who?','Time'))
         + sec('Jobs / Tasks to do today', jobRows(5,r), '<span class="hrs-total" id="hrsTotal"></span>')
         + sec('Goals to work on', ta('goalsText',r,'',150));
    right = sec('Notes', ta('jobNotes',r,'',200));
  } else {
    left = sec('Personal Appts', pairRows('personal',12,r,'What','Time'))
         + sec('Goals to work on', ta('goalsText',r,'',110));
    right = sec('Notes', ta('jobNotes',r,'',200));
  }

  document.getElementById('sheet').innerHTML =
    `<div class="quote">${esc(c.quote)}</div>`+
    ((c.topic && !(lay==='sun' && c.tb))?`<div class="topic"><b>Safety Toolbox topic:</b> ${esc(c.topic)}</div>`:'')+
    `<div class="cols"><div class="col left">${left}</div><div class="col right">${right}</div></div>`+
    `<div class="foot">${esc(c.foot)}</div>`;

  paintWeek(); updateHrs(); updateStatus();
}

function updateHrs(){
  const el=document.getElementById('hrsTotal'); if(!el) return;
  const r=rec(iso(cur),false);
  let t=0,any=false;
  (r.jobs||[]).forEach(j=>{const v=parseFloat(j&&j[1]); if(!isNaN(v)){t+=v;any=true;}});
  el.textContent = any ? ('Budgeted: '+(Math.round(t*100)/100)+' hrs') : '';
}
function updateStatus(){
  const r=rec(iso(cur),false);
  const jobs=(r.jobs||[]).filter(j=>j&&(j[0]||'').trim());
  const done=jobs.filter(j=>j[2]).length;
  const n=Object.keys(store.days).filter(hasData).length;
  document.getElementById('statusLine').textContent =
    (jobs.length? `${done}/${jobs.length} tasks done · ` : '') +
    `${n} day${n===1?'':'s'} filled in` + (canPersist?'':' · storage blocked, use Export to keep your data');
}
function paintWeek(){
  const start=addDays(cur,-((cur.getDay()+6)%7)); // Monday
  let h='';
  for(let i=0;i<7;i++){
    const d=addDays(start,i), k=iso(d);
    h+=`<div class="wd${k===iso(cur)?' sel':''}${hasData(k)?' has':''}" data-go="${k}">
      <div class="d1">${DOWN[d.getDay()].slice(0,3)}</div>
      <div class="d2">${d.getDate()}</div>
      <div class="dot"></div></div>`;
  }
  document.getElementById('weekStrip').innerHTML=h;
}

/* ---------- in-page dialogs (iOS Safari can block native confirm/alert) ---------- */
function ask(title,msg,buttons){
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.className='overlay noprint';
    const m=document.createElement('div'); m.className='modal';
    const h=document.createElement('h3'); h.textContent=title; m.appendChild(h);
    if(msg){ const p=document.createElement('p'); p.textContent=msg; m.appendChild(p); }
    const row=document.createElement('div'); row.className='mbtns';
    let done=false;
    const finish=v=>{ if(done) return; done=true; ov.remove(); document.removeEventListener('keydown',key); resolve(v); };
    buttons.forEach(b=>{
      const el=document.createElement('button');
      el.className='mbtn'+(b.kind?' '+b.kind:'');
      el.textContent=b.label;
      el.onclick=()=>finish(b.id);
      row.appendChild(el);
    });
    m.appendChild(row); ov.appendChild(m);
    ov.addEventListener('click',e=>{ if(e.target===ov) finish(null); });
    const key=e=>{ if(e.key==='Escape') finish(null); };
    document.addEventListener('keydown',key);
    document.body.appendChild(ov);
    const first=row.querySelector('.mbtn.primary,.mbtn.danger')||row.firstChild;
    if(first&&first.focus) first.focus();
  });
}
function toast(msg){
  const t=document.createElement('div');
  t.className='toast noprint'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}

/* ---------- input handling ---------- */
function setVal(f,i,j,val,checkbox){
  const r=rec(iso(cur),true);
  if(i===null||i===undefined){ r[f]=val; }
  else if(j===null||j===undefined){ while(r[f].length<=i) r[f].push(''); r[f][i]=val; }
  else { while(r[f].length<=i) r[f].push([]); if(!Array.isArray(r[f][i])) r[f][i]=[]; r[f][i][j]=val; }
  queueSave();
}
document.getElementById('sheet').addEventListener('input',e=>{
  const t=e.target; const f=t.dataset.f; if(!f) return;
  const i=t.dataset.i===undefined?null:+t.dataset.i;
  const j=t.dataset.j===undefined?null:+t.dataset.j;
  setVal(f,i,j,t.value);
  if(f==='jobs') updateHrs();
});
document.getElementById('sheet').addEventListener('change',e=>{
  const t=e.target; if(t.type!=='checkbox') return;
  const f=t.dataset.f, i=+t.dataset.i, j=+t.dataset.j;
  setVal(f,i,j,t.checked?1:0);
  t.closest('.r').classList.toggle('done',t.checked);
  updateStatus();
});
document.getElementById('sheet').addEventListener('click',e=>{
  const b=e.target.closest('[data-add]'); if(!b) return;
  const f=b.dataset.add, r=rec(iso(cur),true);
  const cnt=b.previousElementSibling.querySelectorAll('.r').length;
  while(r[f].length<=cnt) r[f].push(f==='goals'?'':[]);
  saveStore(); render();
  const nb=document.querySelector('[data-add="'+f+'"]');
  if(nb){
    const rows=nb.previousElementSibling.querySelectorAll('.r');
    const last=rows[rows.length-1];
    if(last){const inp=last.querySelector('input.f'); if(inp) inp.focus();}
  }
});
document.getElementById('weekStrip').addEventListener('click',e=>{
  const w=e.target.closest('[data-go]'); if(!w) return;
  cur=parseISO(w.dataset.go); render();
});

/* ---------- nav ---------- */
function go(n){ cur=addDays(cur,n); render(); }
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.getElementById('btnToday').onclick=()=>{cur=parseISO(TODAY);render();};
document.getElementById('datePick').onchange=e=>{ if(e.target.value){cur=parseISO(e.target.value);render();} };
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowLeft')go(-1);
  else if(e.key==='ArrowRight')go(1);
  else if(e.key==='t'||e.key==='T'){cur=parseISO(TODAY);render();}
});
/* make textareas show all their text on paper */
window.addEventListener('beforeprint',()=>{
  document.querySelectorAll('#sheet textarea').forEach(t=>{
    t.dataset.h=t.style.height||''; t.style.height='auto';
    t.style.height=Math.max(t.scrollHeight+4, parseInt(t.dataset.h)||0)+'px';
  });
});
window.addEventListener('afterprint',()=>{
  document.querySelectorAll('#sheet textarea').forEach(t=>{ t.style.height=t.dataset.h||''; });
});

/* ---------- carry / clear ---------- */
document.getElementById('btnCarry').onclick=()=>{
  const r=rec(iso(cur),false);
  const open=(r.jobs||[]).filter(j=>j&&(j[0]||'').trim()&&!j[2]);
  if(!open.length){ toast('No unfinished tasks on this day.'); return; }
  const nk=iso(addDays(cur,1)), nr=rec(nk,true);
  open.forEach(j=>nr.jobs.push([j[0],j[1]||'',0]));
  saveStore(); cur=addDays(cur,1); render(); flagSaved();
  toast(open.length+' task'+(open.length===1?'':'s')+' carried forward');
};
document.getElementById('btnClear').onclick=async()=>{
  const k=iso(cur);
  const label=DOWN[cur.getDay()]+', '+MONN[cur.getMonth()]+' '+cur.getDate();
  if(!hasData(k)){ toast('Nothing typed on this day yet.'); return; }
  const gone=JSON.stringify(store.days[k]);          // keep a copy so Undo works
  const a=await ask('Clear this day?','Everything you typed on '+label+' will be removed.',
    [{id:'cancel',label:'Cancel'},{id:'ok',label:'Clear',kind:'danger'}]);
  if(a!=='ok') return;
  delete store.days[k];
  saveStore(); render(); flagSaved();
  const t=document.createElement('div');
  t.className='toast noprint';
  t.textContent=label+' cleared. ';
  const u=document.createElement('button');
  u.className='mbtn'; u.style.cssText='margin-left:10px;padding:5px 12px;min-height:0;font-size:13px';
  u.textContent='Undo';
  u.onclick=()=>{ store.days[k]=JSON.parse(gone); saveStore(); render(); t.remove(); toast('Restored'); };
  t.appendChild(u);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),6000);
};

function owner(){ return (store.owner||'').trim(); }
function tagClean(v){
  return String(v===undefined||v===null?'':v)
    .replace(/[\[\]\|~\r\n]+/g,' ').replace(/\s+/g,' ').trim();
}
function usDash(i){ if(!i) return ''; const a=i.split('-'); return a[1]+'-'+a[2]+'-'+a[0]; }
function usShort(i){ if(!i) return ''; const a=i.split('-'); return a[1]+'-'+a[2]+'-'+a[0].slice(2); }
function bbTag(code,jobNo,jobName,date){
  return '[BB|'+code+'|'+(tagClean(jobNo)||'NOJOB')+'|'+(tagClean(jobName)||'Unknown')+'|'+(date||'')+']';
}
function metaBlock(o){ return ''; }  /* routing tags retired - emails are plain now */

/* ---------- export / import ---------- */
function downloadBlob(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
}
/* hand a file to the iOS/Android share sheet, else download it */
async function shareFile(blob,name,title,altTypes,text){
  if(navigator.share && navigator.canShare){
    for(const type of [blob.type].concat(altTypes||[])){
      try{
        const file=new File([blob],name,{type});
        if(!navigator.canShare({files:[file]})) continue;
        const payload={files:[file],title:title};
        if(text) payload.text=text;
        await navigator.share(payload);
        flagSaved(); return true;
      }catch(err){
        if(err && err.name==='AbortError') return true;   // user tapped Cancel
      }
    }
  }
  downloadBlob(blob,name); return false;
}

}

/* ===================== tiny self-contained PDF writer =====================
   Draws the current day as a single Letter page, laid out like the
   original planner sheet. No libraries, no network.                        */

/* WinAnsi byte for a unicode char (falls back to '?') */
const WA_SPECIAL={0x20AC:128,0x201A:130,0x0192:131,0x201E:132,0x2026:133,0x2020:134,0x2021:135,
  0x02C6:136,0x2030:137,0x0160:138,0x2039:139,0x0152:140,0x017D:142,0x2018:145,0x2019:146,
  0x201C:147,0x201D:148,0x2022:149,0x2013:150,0x2014:151,0x02DC:152,0x2122:153,0x0161:154,
  0x203A:155,0x0153:156,0x017E:158,0x0178:159};
function waByte(ch){
  const c=ch.charCodeAt(0);
  if(c>=32&&c<=126) return c;
  if(WA_SPECIAL[c]!==undefined) return WA_SPECIAL[c];
  if(c>=160&&c<=255) return c;
  if(c===0x2212) return 45;           // minus
  return 63;                          // '?'
}
function widthOf(str,size,bold){
  const W=bold?WB:WH; let t=0;
  for(let i=0;i<str.length;i++){ const b=waByte(str[i]); t+= (b>=32? (W[b-32]||500):0); }
  return t*size/1000;
}
function pdfEscape(str){
  let out='';
  for(let i=0;i<str.length;i++){
    const b=waByte(str[i]);
    if(b===40||b===41||b===92) out+='\\'+String.fromCharCode(b);
    else out+=String.fromCharCode(b);
  }
  return out;
}
function wrapText(str,size,bold,maxW){
  const lines=[];
  String(str==null?'':str).split(/\r?\n/).forEach(para=>{
    if(!para.trim()){ lines.push(''); return; }
    let line='';
    para.split(/\s+/).forEach(word=>{
      const trial=line?line+' '+word:word;
      if(widthOf(trial,size,bold)<=maxW){ line=trial; return; }
      if(line){ lines.push(line); line=''; }
      let w=word;
      while(widthOf(w,size,bold)>maxW && w.length>1){
        let cut=w.length;
        while(cut>1 && widthOf(w.slice(0,cut),size,bold)>maxW) cut--;
        lines.push(w.slice(0,cut)); w=w.slice(cut);
      }
      line=w;
    });
    if(line) lines.push(line);
  });
  return lines;
}
function clipText(str,size,bold,maxW){
  str=String(str==null?'':str);
  if(widthOf(str,size,bold)<=maxW) return str;
  let s=str;
  while(s.length>1 && widthOf(s+'…',size,bold)>maxW) s=s.slice(0,-1);
  return s+'…';
}

/* ---- drawing surface ---- */
function Canvas(){
  this.ops=[];
  this.txt=(x,y,s,size,bold,italic,gray)=>{
    if(s===''||s==null) return;
    const f= bold?'/F2':(italic?'/F3':'/F1');
    this.ops.push(`BT ${gray!=null?gray.toFixed(2)+' g ':'0 g '}${f} ${size} Tf 1 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)} Tm (${pdfEscape(s)}) Tj ET`);
  };
  this.line=(x1,y1,x2,y2,w)=>{
    this.ops.push(`${(w||0.6).toFixed(2)} w 0 G ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
  };
  this.rect=(x,y,w,h,lw)=>{
    this.ops.push(`${(lw||0.6).toFixed(2)} w 0 G ${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re S`);
  };
  this.fill=(x,y,w,h,gray)=>{
    this.ops.push(`${gray.toFixed(2)} g ${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
  };
}
function buildPDF(canvas,W,H){
  const content=canvas.ops.join('\n');
  const objs=[];
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
  objs[3]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 5 0 R /F2 6 0 R /F3 7 0 R >> >> /Contents 4 0 R >>`;
  objs[4]=`<< /Length ${content.length} >>\nstream\n${content}\nendstream`;
  objs[5]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[6]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  objs[7]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>';
  let out='%PDF-1.4\n', offs=[];
  for(let i=1;i<objs.length;i++){ offs[i]=out.length; out+=`${i} 0 obj\n${objs[i]}\nendobj\n`; }
  const xref=out.length;
  out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for(let i=1;i<objs.length;i++) out+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  out+=`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes=new Uint8Array(out.length);
  for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&0xff;
  return new Blob([bytes],{type:'application/pdf'});
}

/* ---- lay the day out ---- */
function dayPDF(date){
  const PW=612, PH=792, M=36, CW=PW-2*M;
  const LW=Math.round(CW*0.5), RX=M+LW, RW=CW-LW;
  const c=new Canvas();
  const k=iso(date), r=rec(k,false), info=contentFor(date), lay=layoutFor(date);
  const showTopic = info.topic && !(lay==='sun' && info.tb);

  /* ---- build the left column as a list of blocks so we can size it first ---- */
  const B=[];
  const push=(type,o)=>B.push(Object.assign({type},o));
  const rowsOf=(f,min)=>Math.max(min,(r[f]||[]).length);
  if(lay==='week'||lay==='sat'){
    push('head',{t:'WEATHER'});
    push('rows',{f:'weather',n:1,single:true});
    push('head',{t:lay==='week'?'APPOINTMENTS / TRAINING TODAY':'APPOINTMENTS TODAY'});
    push('rows',{f:'appts',n:rowsOf('appts',lay==='week'?5:3),pair:true});
    push('head',{t:'JOBS / TASKS TO DO TODAY',right:hoursLabel(r)});
    push('rows',{f:'jobs',n:rowsOf('jobs',lay==='week'?7:5),jobs:true});
    if(lay==='week'){
      push('head',{t:'PERSONAL APPTS'});
      push('rows',{f:'personal',n:rowsOf('personal',3),pair:true});
      push('head',{t:'GOALS TO WORK ON'});
      push('rows',{f:'goals',n:rowsOf('goals',2),line:true});
      push('head',{t:'VERBAL AGREEMENTS MADE'});
      push('text',{v:r.verbal,min:3});
      push('head',{t:'NOTES ABOUT EMPLOYEES'});
      push('text',{v:r.notesEmp,min:3});
    } else {
      push('head',{t:'GOALS TO WORK ON'});
      push('text',{v:r.goalsText,min:5});
    }
  } else {
    push('head',{t:'PERSONAL APPTS'});
    push('rows',{f:'personal',n:rowsOf('personal',12),pair:true});
    push('head',{t:'GOALS TO WORK ON'});
    push('text',{v:r.goalsText,min:3});
  }

  /* header heights */
  const FS=8.5, HS=7;
  const quoteLines=wrapText(info.quote,9.5,false,CW-16);
  const topicLines=showTopic?wrapText('Safety Toolbox topic: '+info.topic,9,false,CW-16):[];
  const titleH=20, quoteH=quoteLines.length*11+8, topicH=showTopic?topicLines.length*11+6:0, footH=16;

  /* size the left column so it fills the page the way the original sheet did */
  const avail=PH-2*M-titleH-quoteH-topicH-footH;
  const headH=13, textLH=10.5;
  let rowH=15, extra=0;
  const nRows=B.reduce((s,b)=>s+(b.type==='rows'?b.n:0),0);
  const nText=B.filter(b=>b.type==='text').length;
  const measure=(rh,ex)=>B.reduce((s,b)=>{
    if(b.type==='head') return s+headH;
    if(b.type==='rows') return s+b.n*rh;
    return s+Math.max(b.min,wrapText(b.v,FS,false,LW-12).length)*textLH+5+ex;
  },0);
  while(measure(rowH,0)>avail && rowH>10.5) rowH-=0.5;
  while(nRows && measure(rowH+0.5,0)<=avail && rowH<22) rowH+=0.5;
  const slack=avail-measure(rowH,0);
  if(slack>0){
    if(nText) extra=slack/nText;
    else if(nRows) rowH=Math.min(26,rowH+slack/nRows);
  }

  /* ---- draw ---- */
  let y=PH-M;                                   // running top edge
  const box=(x,w,h)=>{ c.rect(x,y-h,w,h); };
  /* title + date */
  c.txt(M+6,y-14,DOWN[date.getDay()]+', '+MONN[date.getMonth()]+' '+date.getDate()+', '+date.getFullYear(),12,true);
  const stamp='Builder’s Bloc Day Planner';
  c.txt(M+CW-6-widthOf(stamp,8,false),y-13,stamp,8,false,false,0.45);
  y-=titleH;
  /* quote band */
  c.fill(M,y-quoteH,CW,quoteH,0.85);
  c.rect(M,y-quoteH,CW,quoteH);
  quoteLines.forEach((l,i)=>c.txt(M+8,y-12-i*11,l,9.5,false,true));
  y-=quoteH;
  /* safety topic */
  if(showTopic){
    c.rect(M,y-topicH,CW,topicH);
    const lbl='Safety Toolbox topic:';
    topicLines.forEach((l,i)=>{
      if(i===0){
        c.txt(M+8,y-11,lbl,9,true);
        c.txt(M+8+widthOf(lbl,9,true)+3,y-11,l.slice(lbl.length).trim(),9,false);
      } else c.txt(M+8,y-11-i*11,l,9,false);
    });
    y-=topicH;
  }
  const bodyTop=y;

  /* left column blocks */
  let ly=y;
  B.forEach(b=>{
    if(b.type==='head'){
      c.rect(M,ly-headH,LW,headH);
      c.txt(M+6,ly-9,b.t,HS,true,false,0.25);
      if(b.right) c.txt(M+LW-6-widthOf(b.right,HS,true),ly-9,b.right,HS,true,false,0.35);
      ly-=headH; return;
    }
    if(b.type==='rows'){
      const timeW=52, ckW=14, hrW=34;
      for(let i=0;i<b.n;i++){
        const top=ly-i*rowH;
        c.rect(M,top-rowH,LW,rowH);
        if(b.single){
          c.txt(M+6,top-rowH+4.5,clipText(r.weather,FS,false,LW-12),FS,false);
        } else if(b.pair){
          const v=(r[b.f]&&r[b.f][i])||[];
          c.line(M+LW-timeW,top,M+LW-timeW,top-rowH);
          c.txt(M+6,top-rowH+4.5,clipText(v[0],FS,false,LW-timeW-12),FS,false);
          c.txt(M+LW-timeW+5,top-rowH+4.5,clipText(v[1],FS,false,timeW-10),FS,false);
        } else if(b.jobs){
          const v=(r.jobs&&r.jobs[i])||[];
          c.line(M+ckW,top,M+ckW,top-rowH);
          c.line(M+LW-hrW,top,M+LW-hrW,top-rowH);
          c.rect(M+4,top-rowH+ (rowH-7)/2,7,7,0.5);
          if(v[2]){                                   /* check mark */
            c.line(M+5.4,top-rowH+(rowH-7)/2+3.4, M+7,top-rowH+(rowH-7)/2+1.4,1);
            c.line(M+7,top-rowH+(rowH-7)/2+1.4, M+9.8,top-rowH+(rowH-7)/2+5.6,1);
          }
          c.txt(M+ckW+5,top-rowH+4.5,clipText(v[0],FS,false,LW-ckW-hrW-12),FS,false,false,v[2]?0.45:0);
          c.txt(M+LW-hrW+5,top-rowH+4.5,clipText(v[1],FS,false,hrW-10),FS,false,false,v[2]?0.45:0);
        } else {
          c.txt(M+6,top-rowH+4.5,clipText((r[b.f]&&r[b.f][i])||'',FS,false,LW-12),FS,false);
        }
      }
      ly-=b.n*rowH; return;
    }
    /* free text block */
    const lines=wrapText(b.v,FS,false,LW-12);
    const h=Math.max(b.min,lines.length)*textLH+5+extra;
    c.rect(M,ly-h,LW,h);
    lines.forEach((l,i)=>c.txt(M+6,ly-11-i*textLH,l,FS,false));
    ly-=h;
  });

  /* right column — notes, full height of the left column */
  const colH=bodyTop-ly;
  c.rect(RX,ly,RW,colH);
  c.rect(RX,bodyTop-headH,RW,headH);
  c.txt(RX+6,bodyTop-9,lay==='week'?'JOB NOTES':'NOTES',HS,true,false,0.25);
  const noteLines=wrapText(r.jobNotes,FS,false,RW-14);
  const maxLines=Math.floor((colH-headH-8)/textLH);
  noteLines.slice(0,maxLines).forEach((l,i)=>c.txt(RX+7,bodyTop-headH-11-i*textLH,l,FS,false));
  if(noteLines.length>maxLines)
    c.txt(RX+7,ly+5,'… '+(noteLines.length-maxLines)+' more line(s) — see the app',7,false,true,0.5);

  /* footer */
  c.rect(M,ly-footH,CW,footH);
  const f=info.foot||'';
  c.txt(M+CW/2-widthOf(f,8.5,false)/2, ly-11, f, 8.5,false,false,0.3);

  return buildPDF(c,PW,PH);
}
function hoursLabel(r){
  let t=0,any=false;
  (r.jobs||[]).forEach(j=>{const v=parseFloat(j&&j[1]); if(!isNaN(v)){t+=v;any=true;}});
  return any?('Budgeted: '+(Math.round(t*100)/100)+' hrs'):'';
}

/* ---------- boot ---------- */
drawFractions(); drawTable('vTable',VH,VENDORS); drawTable('uTable',UH,CUSTOMERS);
renderContacts(); calcSlab(); calcPier(); render();
if(!canPersist) flagSaved();
